[colors]
# Mengubah background menjadi #1f1f1f sesuai permintaan
background = #1f1f1f
dark-grey = #32343d
grey = #7c818c
green = #06c26d
orange = #ff7043
blue = #5294e2
red = #f71616
white = #ffffff

[bar/bar]
# Membuat ukuran bar lebih kecil (dari 34 menjadi 26)
height = 26
width = 100%
bottom = false
background = ${colors.background}
separator = ""

# Mengecilkan ukuran font & ikon modul (size dari 10/11 turun ke 9)
font-0 = "JetBrainsMono Nerd Font:size=9;2"
font-1 = "Font Awesome 7 Free:style=Regular:size=9;2"
font-2 = "Font Awesome 7 Free Solid:style=Solid:size=9;2"
font-3 = "Font Awesome 7 Brands:style=Regular:size=9;2"

module-margin = 1
modules-left = workspaces tray
modules-center = time
modules-right = pulseaudio wlan memory battery powermenu

line-size = 1

[module/tray]
type = internal/tray
# Menyesuaikan ukuran tray agar pas dengan bar yang lebih kecil
tray-size = 14

[module/empty-space]
type = custom/text
content = ""

[module/powermenu]
type = custom/menu
format-spacing = 1
label-open = "[00]"
label-open-foreground = ${colors.white}
label-close = ""
label-close-foreground = ${colors.red}
label-separator = |
label-separator-foreground = ${colors.blue}

menu-0-0 = 
menu-0-0-exec = alacritty
menu-0-1 = 
menu-0-1-exec = onboard
menu-0-2 = 
menu-0-2-exec = systemctl poweroff

[module/workspaces]
type = internal/xworkspaces

pin-workspaces = false
enable-click = true
enable-scroll = false

format = <label-state>
label-monitor = %name%

label-active = 
label-active-foreground = ${colors.blue}
label-active-background = ${colors.dark-grey}
label-occupied = 
label-occupied-foreground = ${colors.white}
label-occupied-background = ${colors.background}
label-urgent = 
label-urgent-foreground = ${colors.red}
label-urgent-background = ${colors.background}
label-empty = 
label-empty-foreground = ${colors.grey}
label-empty-background = ${colors.background}

# Mengecilkan padding modul agar space antarikon lebih rapat
label-active-padding = 1
label-urgent-padding = 1
label-occupied-padding = 1
label-empty-padding = 1

[module/cpu]
type = internal/cpu
interval = 4
format-prefix =" "
format =  <label>
format-prefix-foreground = ${colors.blue}
label = "%percentage%%"
label-padding = 0

[module/memory]
type = internal/memory
interval = 4
format-prefix = "  "
format-prefix-foreground = ${colors.blue}
format-foreground = ${colors.white}
format = <label>
label = %mb_used%

[module/wlan]
type = internal/network
interface = wlp2s0
interval = 2.0

format-connected = <label-connected>
format-connected-prefix = "%{A1:$TERMINAL -e nmtui:} 說 "
format-connected-prefix-foreground = ${colors.blue}
format-connected-padding = 0
label-connected = "%signal%% %{A} %essid% "

format-disconnected = <label-disconnected>
format-disconnected-prefix = "%{A1:$TERMINAL -e nmtui:} ﲁ "
format-disconnected-prefix-foreground = ${colors.blue}
format-disconnected-padding = 0
label-disconnected = "DCT %{A}"

ramp-signal-0 = 
ramp-signal-1 = 
ramp-signal-2 = 
ramp-signal-3 = 
ramp-signal-4 = 
ramp-signal-foreground = ${colors.foreground-alt}

[module/time]
type = internal/date

format-prefix-foreground = ${colors.blue}
label = %date%, %time%
date = %a %d %B %y
time = %H:%M

[module/pulseaudio]
type = internal/pulseaudio

clight-left = ~/scripts/volume.sh up
click-right = pavucontrol

format-volume = <ramp-volume> <label-volume>
format-muted = <label-muted>
label-muted-foreground = ${colors.red}

label-muted = ﱝ Muted

ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 

ramp-volume-0-foreground = ${colors.blue}
ramp-volume-1-foreground = ${colors.orange}
ramp-volume-2-foreground = ${colors.red}

[module/battery]
type = internal/battery

low-at = 25

battery = BAT1
adapter = ACAD
poll-interval = 5

format-charging-prefix = "  "
format-charging-prefix-foreground = ${colors.green}
format-discharging-prefix = "  "
format-discharging-prefix-foreground = ${colors.blue}
format-full-prefix = "  "
format-full-prefix-foreground = ${colors.blue}
format-discharging-padding = 1
format-charging-padding = 1
format-full-padding = 1


